# Prometheus + Grafana on loopback, next to a mynah-asr-server on the same host.
# host networking so both reach the server's 127.0.0.1-only /metrics; each binds
# loopback itself. Linux only (Docker Desktop has no host network for this).
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
  grafana:
    image: grafana/grafana:11.3.1
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  # optional: the same page forwarded over OTLP (docker compose --profile otel up)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    profiles: [otel]
    network_mode: host
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4318}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
