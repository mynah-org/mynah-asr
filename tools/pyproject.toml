[project]
name = "mynah-tools"
version = "0.0.1"
description = "Offline tooling for Mynah: weight conversion, reference oracle, eval"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "sentencepiece>=0.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# the torch oracle and the golden generation need heavy extras:
#   uv sync --extra oracle
oracle = [
    "torch>=2.4",
]

[tool.uv]
package = false
