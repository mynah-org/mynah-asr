# Release: builds the `make dist` tarball on the three supported platforms and
# publishes it on the tag's GitHub Release (until v0.4.0 the assets were built
# by hand on a Mac, so Linux users had nothing to download).
#
# Portability: the default CFLAGS carry -march=native, which is right for a
# local build and wrong for a binary someone else runs (SIGILL on an older
# CPU). Here CFLAGS is overridden *via the environment* — the Makefile declares
# it with `?=` and then `+=` the BLAS/version flags, so an env override keeps
# them, while a command-line `make CFLAGS=...` would silently drop them.
# The int8/int4 kernels dispatch AVX2/VNNI at runtime (qmat.c), so the x86
# baseline costs nothing on the quantized path.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also publish a draft release with the binaries'
        type: boolean
        default: false

jobs:
  build:
    name: "${{ matrix.os }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
            # baseline x86-64 + runtime SIMD dispatch: runs on any 64-bit x86
            cflags: -std=c11 -O3 -mtune=generic -ffast-math -Wall -Wextra -iquote src -D_DEFAULT_SOURCE
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            # dotprod (SDOT) is compile-time on ARM: armv8.2+dotprod covers
            # Graviton2+, Ampere, Snapdragon, RPi5 — not the RPi4 (Cortex-A72)
            cflags: -std=c11 -O3 -march=armv8.2-a+dotprod -ffast-math -Wall -Wextra -iquote src -D_DEFAULT_SOURCE
          - runner: macos-latest
            os: darwin
            arch: arm64
            # Apple clang defaults to apple-m1 (NEON+dotprod always present)
            cflags: -std=c11 -O3 -ffast-math -Wall -Wextra -iquote src -D_DEFAULT_SOURCE

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags: `mynah --version` reports the release name

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Version string
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release tarball
        env:
          CFLAGS: ${{ matrix.cflags }}
        run: make dist MYNAH_BUILD=${{ steps.v.outputs.name }}

      - name: Smoke test the packaged binaries
        run: |
          tar xzf dist/mynah-${{ steps.v.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C dist
          D=dist/mynah-${{ steps.v.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}
          # the version string must carry the tag, not a stale git describe
          "$D/bin/mynah" --version | tee /dev/stderr | grep -q "${{ steps.v.outputs.name }}"
          # mynah-server exits 2 on --help by design: check the usage line instead
          "$D/bin/mynah-server" --help 2>&1 | grep -q 'uso: mynah-server'

      - name: Kernel self-test (no model needed)
        env:
          CFLAGS: ${{ matrix.cflags }}
        run: make tests/test_qmat && tests/test_qmat

      - uses: actions/upload-artifact@v4
        with:
          name: mynah-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/mynah-${{ steps.v.outputs.name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tarballs + checksums
        run: |
          mkdir -p release
          find artifacts -type f -name 'mynah-*.tar.gz' -exec cp {} release/ \;
          cd release && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Version string
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.name }}
          name: "mynah ${{ steps.v.outputs.name }}"
          files: release/*
          generate_release_notes: true
          # a manual run never publishes on top of a tag: it stays a draft
          draft: ${{ github.event_name == 'workflow_dispatch' }}
