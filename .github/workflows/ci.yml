# Mynah CI: build matrix + FUNCTIONAL tests with a real model (lesson from
# qwen-tts: build-only CI protects nothing). The test model is
# parakeet-tdt_ctc-110m (114M, CC-BY-4.0, RTF ~0.03): converted artifacts are
# cached (actions/cache, key on converter+oracle hash) and HF is only contacted
# on a cache miss — the prepare-model job warms the cache ONCE, so the 3-OS
# matrix never races to download. Nemotron/v3 and the big models remain
# local-only tests (exit 77 = SKIP). Download/convert logic lives in
# .github/actions/prepare-model (shared with safety.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MODEL: parakeet-tdt_ctc-110m
  MODEL_URL: https://huggingface.co/nvidia/parakeet-tdt_ctc-110m/resolve/main/parakeet-tdt_ctc-110m.nemo

jobs:
  prepare-model:
    name: Prepare model (warm shared cache)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-model
        with:
          model: ${{ env.MODEL }}
          model-url: ${{ env.MODEL_URL }}

  build-test:
    name: Build & Test
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        # BLAS is stated, never inferred (ENGINEERING.md §5): `none` is the
        # Linux default and is what production links, so that is what the
        # functional suite runs on both x86 and ARM. The OpenBLAS arm is kept
        # alive by the build-openblas job below.
        include:
          - os: ubuntu-latest        # x86_64: also validates the AVX2/VNNI kernels
            blas: none
          - os: ubuntu-24.04-arm     # aarch64: NEON/SDOT
            blas: none
          - os: macos-latest         # arm64: Accelerate + Metal
            blas: accelerate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BLAS: ${{ matrix.blas }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make BLAS=$BLAS

      # The banner is the proof that the build really linked what the matrix
      # asked for; a job that only says "make succeeded" proves nothing.
      # BLAS=none links our own sgemm, which the runtime calls `own`.
      - name: Prove the f32 GEMM provider
        run: |
          want=$BLAS
          [ "$want" = none ] && want=own
          ./mynah-asr --dispatch-map > map.txt
          grep -qE "^gemm\.f32 +$want " map.txt || { cat map.txt; exit 1; }
          echo "f32 GEMM provider: $want"

      # Board, repository and flag-registry integrity (ENGINEERING.md §1, §12, §6):
      # no dangling plan link, no tracked script depending on an untracked file,
      # every environment flag the tree reads declared once.
      - name: Repository checks (make check)
        run: make check

      - name: Kernel self-test (no model needed)
        run: make BLAS=$BLAS tests/test_qmat && tests/test_qmat
      # Our own f32 GEMM: every family against the scalar reference, the seam
      # against the reference in whichever build this is, and byte-identical
      # output at 1/2/4/8 threads. Model-free, so it fails fast here.
      - name: f32 GEMM self-test (no model needed)
        run: make BLAS=$BLAS tests/test_sgemm && tests/test_sgemm
        # the forced aligner is model-free too, and it runs again inside `make
        # test` below; here it fails fast, before the model download
      - name: Forced alignment self-test (no model needed)
        run: make BLAS=$BLAS tests/test_align && tests/test_align

      - name: Kernel self-test — explicit SIMD levels (x86)
        if: matrix.os == 'ubuntu-latest'
        run: |
          MYNAH_ASR_CAPS=scalar tests/test_qmat
          MYNAH_ASR_CAPS=avx2   tests/test_qmat   # downgrades with a note if unsupported
          MYNAH_ASR_CAPS=vnni   tests/test_qmat   # EVEX or VEX VPDPBUSD, whichever this runner has

      # S5-1: the ARM ladder is scalar < sdot < smmla. `sdot` takes SMMLA out of
      # the run without a rebuild, which is what makes the two arms comparable.
      # The identity gate prints the kernels it exercised and the ones it
      # skipped, so this log is the evidence that the i8mm path really ran —
      # the macOS dev box has dotprod but no FEAT_I8MM and can only compile it.
      - name: Kernel self-test — explicit SIMD levels (ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          MYNAH_ASR_CAPS=scalar tests/test_qmat
          MYNAH_ASR_CAPS=sdot   tests/test_qmat
          MYNAH_ASR_CAPS=smmla  tests/test_qmat   # downgrades with a note if unsupported
          ./mynah-asr --dispatch-map

      - name: Restore converted model (cache warmed by prepare-model)
        uses: ./.github/actions/prepare-model
        with:
          model: ${{ env.MODEL }}
          model-url: ${{ env.MODEL_URL }}

      - name: Setup uv                # needed by test-samples (Python eval)
        uses: astral-sh/setup-uv@v9.0.0   # no floating v9 tag: pin the exact release (node24)

      # Without the checkpoint the VAD parity inside `make test` exits 77 and
      # proves nothing; it is 2.3 MB and MIT, so CI simply fetches it.
      - name: Silero VAD checkpoint (make the vad parity in `make test` real)
        run: make BLAS=$BLAS fetch-vad

      - name: Int8 checkpoint (exercises the quantize path)
        run: ./mynah-asr quantize -m models/${{ env.MODEL }} --quant int8

      - name: Tests (parity vs oracle + e2e; big models skip)
        run: make BLAS=$BLAS test

      # The bindings are public surface that `make test` never touches: they load
      # the shared library by name and call the exported symbols by name, so a
      # rename that misses one breaks them silently (it did: the Node export
      # still said `Mynah` after the mynah-asr rename). This transcribes for
      # real through both FFI layers.
      - name: Shared library for the bindings
        run: make BLAS=$BLAS shared

      - name: Bindings end-to-end (Python ctypes + Node koffi)
        run: |
          python3 bindings/python/example.py models/${{ env.MODEL }} \
            tests/audio/test_en.wav | tee /dev/stderr | grep -qi 'speech recognition test'
          npm install --no-save --no-package-lock koffi
          node bindings/node/example.js models/${{ env.MODEL }} \
            tests/audio/test_en.wav | tee /dev/stderr | grep -qi 'speech recognition test'

      # The server was NEVER exercised in CI: tests/test_server.sh asserts
      # Nemotron-specific transcripts, so with the 110m it just exits 77 — its
      # concurrency and WebSocket cases have been dead here all along. This
      # model-agnostic check covers concurrent requests plus the adaptive-BLAS
      # accounting (a leaked inflight slot caps BLAS for the whole process life).
      - name: Server under concurrent load (model-agnostic)
        run: make BLAS=$BLAS test-server-concurrency CONC_MODEL_DIR=models/${{ env.MODEL }}

      - name: Quality on real audio (samples/ FLEURS, CER with the 110m)
        run: make test-samples

  # The comparison arm, forever. BLAS=openblas is what every Linux A/B is
  # measured against (S1-6a), so it has to keep building and keep passing the
  # model-free self-tests; the day it stops, the A/B has no second arm and the
  # ownership decision has nothing to be compared with. Compile plus the
  # kernel, sgemm and thread self-tests — `make test` for it would double the
  # model download for a build that is not what production links.
  build-openblas:
    name: Build & self-test (BLAS=openblas, the comparison arm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: Build
        run: make BLAS=openblas
      - name: Prove the f32 GEMM provider
        run: |
          ./mynah-asr --dispatch-map > map.txt
          grep -qE "^gemm\.f32 +openblas " map.txt || { cat map.txt; exit 1; }
      - name: Model-free self-tests
        run: |
          make BLAS=openblas tests/test_qmat tests/test_sgemm tests/test_threads
          tests/test_qmat
          tests/test_sgemm
          tests/test_threads

  # Compile-only CUDA build: no GPU on the runner, but it catches build/link
  # regressions in the nvcc path (e.g. the MYNAH_ASR_BUILD quoting bug found on the
  # first real A100 build, 2026-07-20). The runtime falls back to CPU without a
  # device, so the kernel self-test still runs.
  build-cuda:
    name: Build CUDA (compile-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev nvidia-cuda-toolkit
      - name: Build (make cuda)
        run: make cuda
      - name: Smoke test (CPU fallback, no GPU)
        # test binaries must link with the same variant flags as `make cuda`:
        # backend.o was compiled with -DMYNAH_ASR_CUDA and needs cuda_gemm.o+cublas
        run: |
          ./mynah-asr --version
          make EXTRA_CFLAGS="-DMYNAH_ASR_CUDA" OBJ_EXTRA="build/src/cuda_gemm.o" \
               EXTRA_LDFLAGS="-lcublas -lcudart" tests/test_qmat
          tests/test_qmat

  # S14: the CUDA batched streaming server, a separate tree (gpu/). Compile-only
  # in the toolkit container with an explicit architecture list -- no GPU on the
  # runner, so the kernel test must SKIP (77) and the server must say "not
  # compiled"/"no CUDA device" rather than fall back. The cpu-only build of the
  # same server is exercised too: it is the reference engine behind the same seam.
  build-gpu-server:
    name: Build GPU server (compile-only, sm_80/86/89/90)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.6.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: apt-get update && apt-get install -y build-essential git python3
      - name: Library
        run: make lib BLAS=none
      - name: GPU server, kernels test, stream test (nvcc, compile and link)
        run: |
          make -C gpu CUDA_ARCH="sm_80 sm_86 sm_89 sm_90"
          make -C gpu test-kernels test-stream CUDA_ARCH="sm_80 sm_86 sm_89 sm_90"
          ls -la mynah-asr-server-cuda tests/test_cuda_kernels tests/test_cuda_stream
      - name: No device: the kernel test skips, the server refuses visibly
        run: |
          set +e
          tests/test_cuda_kernels; rc=$?
          echo "test_cuda_kernels exit $rc"; [ "$rc" -eq 77 ] || exit 1
          ./mynah-asr-server-cuda --version
          ./mynah-asr-server-cuda -m /nonexistent --engine cuda 2>&1 | tee srv.txt
          grep -q "no CUDA device" srv.txt || exit 1
      - name: cpu-only build of the same server (the reference engine)
        run: |
          make -C gpu cpu
          ./mynah-asr-server-cuda-cpuonly -m /nonexistent --engine cuda 2>&1 | tee stub.txt; true
          grep -q "not compiled" stub.txt
